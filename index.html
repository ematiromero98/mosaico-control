<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mosaico">
<title>Mosaico · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Control del Mosaico para el celular. Habla con la TV por un canal de Supabase Realtime ("mosaico-<código>");
   el código llega en el QR que muestra la TV (Ajustes → Control del celular) y queda guardado en este celular. */
:root {
  --bg: #0b0c10; --key: #17191f; --key-on: #262932; --ink: #f2f1ee; --ink-2: #a3a29d; --ink-3: #676660;
  --line: rgba(255,255,255,.08); --ok: #6fd39a; --warn: #f0b35a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif; }
body { min-height: 100vh; padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.wrap { max-width: 420px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; align-items: center; justify-content: space-between; }
header h1 { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
.estado { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.estado.ok i { background: var(--ok); } .estado.espera i { background: var(--warn); }
.donde { font-size: 13px; color: var(--ink-2); margin-top: -12px; }
button { font: inherit; color: var(--ink); background: var(--key); border: 1px solid var(--line); border-radius: 16px; min-height: 56px; cursor: pointer; transition: transform 80ms, background 80ms; }
button:active { background: var(--key-on); transform: scale(.96); }
button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pad { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 6px auto 0; border-radius: 50%; background: var(--key); border: 1px solid var(--line); }
.pad button { position: absolute; border: 0; background: transparent; border-radius: 50%; min-height: 0; display: grid; place-items: center; color: var(--ink-2); }
.pad button:active { background: var(--key-on); color: var(--ink); }
.pad .u { top: 4%; left: 34%; width: 32%; height: 30%; } .pad .d { bottom: 4%; left: 34%; width: 32%; height: 30%; }
.pad .l { left: 4%; top: 34%; width: 30%; height: 32%; } .pad .r { right: 4%; top: 34%; width: 30%; height: 32%; }
.pad .ok { top: 31%; left: 31%; width: 38%; height: 38%; background: #22252d; color: var(--ink); font-size: 18px; font-weight: 500; border: 1px solid var(--line); }
.fila { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fila button { display: grid; place-items: center; gap: 2px; font-size: 12px; color: var(--ink-2); padding: 8px 0; }
.fila button svg { color: var(--ink); }
.lab { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); margin-bottom: -12px; }
.modos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modos button { display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; }
.apps { display: flex; flex-wrap: wrap; gap: 8px; }
.apps button { min-height: 44px; padding: 0 14px 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 9px; font-size: 14px; }
.apps .dot { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.vacio { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.sin-codigo { display: grid; gap: 14px; text-align: center; padding-top: 12vh; }
.sin-codigo h2 { margin: 0; font-size: 22px; font-weight: 500; }
.sin-codigo p { margin: 0; color: var(--ink-2); line-height: 1.55; font-size: 15px; }
.sin-codigo input { font: inherit; font-size: 20px; letter-spacing: .2em; text-align: center; text-transform: uppercase; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--key); color: var(--ink); width: 100%; }
.err { color: #f07a6a; font-size: 13px; min-height: 18px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="sinCodigo" hidden>
  <div class="sin-codigo">
    <h2>Conectá tu TV</h2>
    <p>En la TV, abrí el Mosaico y andá a <b>Ajustes → Control del celular</b>. Escaneá el QR con la cámara, o escribí el código que aparece debajo.</p>
    <input id="codigoManual" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="ABCD234XYZ" aria-label="Código de la TV">
    <div class="err" id="errCodigo"></div>
    <button id="usarCodigo">Conectar</button>
  </div>
</div>

<div class="wrap" id="control" hidden>
  <header>
    <h1>Mosaico</h1>
    <div class="estado" id="estado"><i></i><span>Conectando…</span></div>
  </header>
  <div class="donde" id="donde"></div>

  <div class="pad">
    <button class="u" data-k="38" aria-label="Arriba"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="l" data-k="37" aria-label="Izquierda"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="ok" data-k="13">OK</button>
    <button class="r" data-k="39" aria-label="Derecha"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="d" data-k="40" aria-label="Abajo"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div class="fila">
    <button data-k="10009"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Volver</button>
    <button data-modo="inicio"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6.5 9.5V19h11V9.5"/></svg>Inicio</button>
    <button data-k="403"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="11" height="16" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/><rect x="16" y="13" width="5" height="7" rx="1.5"/></svg>Diseño</button>
  </div>
  <div class="fila">
    <button data-vol="-"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 12h4"/></svg>Bajar</button>
    <button data-vol="mute"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>Silencio</button>
    <button data-vol="+"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 12h4M19 10v4"/></svg>Subir</button>
  </div>

  <div class="lab">Modos</div>
  <div class="modos">
    <button data-modo="manana"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Mañana</button>
    <button data-modo="ambiente"><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>Ambiente</button>
  </div>

  <div class="lab">Apps</div>
  <div class="apps" id="apps"><div class="vacio">Esperando a la TV…</div></div>
</div>

<script>
(function () {
  "use strict";
  var REALTIME = "wss://nlnzryrwvbqigqzqkqqf.supabase.co/realtime/v1/websocket";
  var CLAVE = "sb_publishable_ju4W4HPkw64Mei6mHbPFWA_dDHTJR3e";
  var $ = function (id) { return document.getElementById(id); };
  var VALIDO = /^[a-z0-9]{10}$/;

  // El código viene en el QR (…/#codigo) y queda guardado para la próxima vez.
  var codigo = (location.hash || "").slice(1).toLowerCase();
  try {
    if (VALIDO.test(codigo)) localStorage.setItem("mosaico-codigo", codigo);
    else codigo = localStorage.getItem("mosaico-codigo") || "";
  } catch (e) {}
  if (location.hash) history.replaceState(null, "", location.pathname);

  function pantalla() {
    var hay = VALIDO.test(codigo);
    $("sinCodigo").hidden = hay;
    $("control").hidden = !hay;
    if (hay) conectar();
  }
  $("usarCodigo").addEventListener("click", function () {
    var c = $("codigoManual").value.trim().toLowerCase();
    if (!VALIDO.test(c)) { $("errCodigo").textContent = "El código tiene 10 letras y números. Fijate en la TV."; return; }
    codigo = c;
    try { localStorage.setItem("mosaico-codigo", c); } catch (e) {}
    pantalla();
  });
  $("codigoManual").addEventListener("input", function () { $("errCodigo").textContent = ""; });

  var ws = null, ref = 0, unido = false, latido = null, espera = 800, ultimaRespuesta = 0;
  function topic() { return "realtime:mosaico-" + codigo; }
  function estado(clase, texto) { $("estado").className = "estado " + clase; $("estado").lastChild.textContent = texto; }

  function conectar() {
    if (ws && ws.readyState < 2) return;
    estado("espera", "Conectando…");
    ws = new WebSocket(REALTIME + "?apikey=" + encodeURIComponent(CLAVE) + "&vsn=1.0.0");
    ws.onopen = function () {
      espera = 800;
      ws.send(JSON.stringify({ topic: topic(), event: "phx_join", ref: String(++ref), join_ref: "1",
        payload: { config: { broadcast: { self: false }, presence: { key: "" }, private: false } } }));
      clearInterval(latido);
      latido = setInterval(function () {
        ws.send(JSON.stringify({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++ref) }));
        if (Date.now() - ultimaRespuesta > 40000) { estado("espera", "Buscando la TV…"); emitir("hola", {}); }
      }, 20000);
    };
    ws.onmessage = function (m) {
      var d;
      try { d = JSON.parse(m.data); } catch (e) { return; }
      if (d.event === "phx_reply" && d.topic === topic() && d.payload.status === "ok" && !unido) {
        unido = true;
        estado("espera", "Buscando la TV…");
        emitir("hola", {});
        return;
      }
      if (d.event === "broadcast" && d.payload && d.payload.event === "estado") mostrarEstado(d.payload.payload || {});
    };
    ws.onclose = function () {
      unido = false;
      clearInterval(latido);
      estado("", "Sin conexión");
      setTimeout(conectar, espera);
      espera = Math.min(espera * 2, 15000);
    };
  }
  function emitir(evento, datos) {
    if (!ws || ws.readyState !== 1 || !unido) return false;
    ws.send(JSON.stringify({ topic: topic(), event: "broadcast", ref: String(++ref),
      payload: { type: "broadcast", event: evento, payload: datos } }));
    return true;
  }

  var NOMBRE_PANTALLA = { home: "Inicio", mosaic: "Mañana", amb: "Ambiente" };
  function mostrarEstado(e) {
    ultimaRespuesta = Date.now();
    estado("ok", "Conectado");
    $("donde").textContent = "En la TV: " + (NOMBRE_PANTALLA[e.pantalla] || "otra app");
    var apps = (e.apps || []).filter(function (a) { return a.id; });
    if (!apps.length) return;
    $("apps").innerHTML = "";
    apps.forEach(function (a) {
      var b = document.createElement("button");
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = a.color || "#5b6478";
      b.appendChild(dot);
      b.appendChild(document.createTextNode(a.nombre));
      b.addEventListener("click", function () { orden({ abrir: a.id }); });
      $("apps").appendChild(b);
    });
  }

  function orden(p) {
    if (navigator.vibrate) navigator.vibrate(10);
    if (!emitir("orden", p)) { estado("", "Sin conexión"); conectar(); }
  }
  [].forEach.call(document.querySelectorAll("[data-k]"), function (b) { b.addEventListener("click", function () { orden({ k: +b.getAttribute("data-k") }); }); });
  [].forEach.call(document.querySelectorAll("[data-modo]"), function (b) { b.addEventListener("click", function () { orden({ modo: b.getAttribute("data-modo") }); }); });
  [].forEach.call(document.querySelectorAll("[data-vol]"), function (b) { b.addEventListener("click", function () { orden({ vol: b.getAttribute("data-vol") }); }); });
  // Al volver a la página (el celular la suspende en segundo plano), reconecta y pregunta dónde está la TV.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden || !VALIDO.test(codigo)) return;
    if (!ws || ws.readyState > 1) conectar(); else emitir("hola", {});
  });

  // Escanear otro QR con la página ya abierta cambia solo el #código: se toma sin recargar.
  window.addEventListener("hashchange", function () {
    var c = location.hash.slice(1).toLowerCase();
    if (!VALIDO.test(c)) return;
    codigo = c;
    try { localStorage.setItem("mosaico-codigo", c); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    unido = false;
    if (ws) ws.close();
    pantalla();
  });

  pantalla();
})();
</script>
</body>
</html>
